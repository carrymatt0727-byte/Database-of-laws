{id:"m",name:"中華民國陸海空軍刑法",en:"Criminal Code of the Armed Forces",date:"民國115年10月16日 初稿",p:[
["第一篇 總則",[
[1,"現役軍人犯本法之罪者，依本法處罰;喪失現役軍人身分者，仍適用本法。"],
[2,"本法所稱現役軍人，指正式進入軍事編制，並擁有軍階、官銜或職權之人員。"],
[3,"一、本法用語定義如下：|(一) 長官：於職權或職務範圍內，對本人有指揮監督權限之軍官、士官或單位幹部。|(二) 上官：指前款以外，而官階高於自身之軍官、士官。|(三) 衛哨兵：指奉命執行警衛、巡邏、哨戒或基地安全維護任務之人員。|(四) 軍用物品與設施：指供國軍作戰、訓練、勤務、通訊、交通、醫療或補給所使用之一切器材、裝備、車輛、艦艇、航空器、電磁紀錄及建築物。|(五) 敵人：經公告之敵對勢力成員、未經許可持械進入軍事管制區且抗拒警告者，或正在對現役軍人及無辜人員進行武力攻擊者。"],
[4,"一、本法之處分種類如下：|（一）遊戲端永久停權。|（二）遊戲端暫時停權。|（三）遊戲端監禁。|（四）剔除軍階或剔除軍籍。|（五）降階。|（六）停職或撤職。|（七）各單位黑名單|(八) 訓練黑名單|（九）撤銷、扣留特定執照資格、記過。|二、前項處分，得單獨或併科罰之。"]]],
["第二篇 處罰分則",[
[5,"一、發布虛假軍事通報或虛偽之報告者，得視危害程度處遊戲端監禁或暫時停權。|二、前項行為致重大勤務中斷、錯誤部署或基地安全受實質影響者，得加重處分。"],
[6,"一、惡意破壞、毀損作戰設施、裝備或軍用物資者，得視破壞程度處遊戲端監禁或暫時停權。|二、前項行為致重要設施停擺、任務中斷或重大損害者，得視情節加重處分。"],
[7,"一、洩漏應保密之文書、情報、作戰計畫、電磁紀錄或物品者，得事情節懲處。|二、資訊是否屬應保密範圍，應以行為發生前已公布之規範為判斷依據。"],
[8,"一、未經許可進入非所屬基地，處遊戲端監禁。|二、經明確要求離開仍拒不離開、反覆侵入或妨礙基地勤務者，得加重處分。"],
[9,"未經授權擅自舉辦訓練或招募者，得立即逮捕，並視情節處遊戲端監禁或暫時停權"],
[10,"訓練或招募官違反權責規定者，得視情節進行懲處。"],
[11,"一、長官利用職權對部屬施以超越管理必要之暴力、脅迫、侮辱，得處遊戲端監禁併降階處分。|二、情節重大或反覆實施者，得併科降階、停職、撤職或其他職務處分。"],
[12,"對長官或上級有公然面斥、侮辱、挑釁、強行頂撞、言語脅迫或私下恐嚇行為者，得視情節處遊戲端監禁併科各單位黑名單處分。"],
[13,"無故擅離營區、演習區域或職勤崗位者，得立即逮捕，並處遊戲端監禁。"],
[14,"一、未滿單位指定所待時間擅自退出單位者，得處五個月以下各單位黑名單。|二、經特許者不再此限。"],
[15,"一、非法退伍者，得處六個月以下訓練黑名單。|二、經特許者不再此限。"],
[16,"一、未加入伺服器公告指定之 Roblox 群組者，不得參與以該群組資格為必要條件之正式軍事訓練。|二、不符合前項資格者，其參與之訓練得不予承認，並依規定重新完成資格確認。|三、活動主辦人明知參與者不符資格仍故意將其列為正式受訓人員者，得依第 10 條辦理。"],
[17,"一、未加入伺服器公告指定之 Discord 群組者，不得參與以該群組資格為必要條件之正式招募程序。|二、不符資格之招募紀錄，得暫不承認其正式效力，並通知相關人員補正。"],
[18,"一、官兵因怠忽職守而致災者，得視情節進行懲處。|二、長官對其職權範圍內之勤務負有明確督導義務，經具體告知風險後仍反覆不履行，致重大影響者，得依其可歸責程度處以記過、降階、停職或撤職。"],
[19,"官兵應依所屬單位已公布之制服規定，配戴指定帽飾、軍服及相應階級識別，違反者得由執法單位命其更換，屢勸不聽者，得處遊戲端監禁。"],
[20,"官兵意圖獲得不法利益而舞弊者，得視情節處遊戲端監禁或暫時停權併科降階處分。"],
[21,"一、意圖為自己或第三人不法之所有，而竊取軍用載具者，得處遊戲端監禁。|二、利用職務權限、故意隱匿載具、反覆竊取，或造成重大勤務影響者，得依情節加重處分。"],
[22,"現役軍人犯本章以外之行為，凡足以破壞軍隊紀律、侵害部隊榮譽或影響作戰安全，且本法未有明文規定者，得處遊戲端監禁併科降階處分。"],
[23,"有下列情形之一者，得於該條規定之處分範圍內加重：|(一) 利用長官、幹部或執法身分實施違規。|(二) 利用職權迫使他人配合違規行為。|(三) 對同一行為反覆實施，經制止仍不改善。|(四) 與他人共同策劃，致危害擴大。|(五) 於重要勤務、軍事訓練或基地安全任務期間實施違規，並實際影響任務執行。|(六) 事後湮滅證據、脅迫證人或故意妨礙調查。"]]],
["第三篇 處分規則",[
[24,"一、違規認定應以可供查證之資料為基礎。|二、可採用之資料包括遊戲錄影、截圖、系統紀錄、時間紀錄、相關對話、任務紀錄及證人陳述。|三、應綜合判斷資料之完整性、真實性、形成時間及與案件之關聯，不得僅因單一人員提出指控即當然成立。|四、經合理質疑為偽造、剪接或脫離原始語境之資料，應進一步查證。"],
[25,"一、一般違規案件，原則上應於行為發生後二十日內提出。|二、持續性違規、事後始能合理發現之違規，或涉及重大安全、偽造證據及重大職權濫用者，得依實際情形另行處理，並說明逾期原因。"],
[26,"一、調查人員應於職權範圍內蒐集、核實及保存相關證據。|二、涉及遊戲紀錄、軍用載具、角色權限或其他數位資產者，得查閱必要之紀錄。"],
[27,"一、為防止正在發生之重大違規、避免證據滅失或維護基地安全，有權單位得採取必要且合比例之暫時管制措施。|二、前項措施得包括暫時移離勤務崗位、限制使用特定權限、暫停執行職務或其他必要措施。|三、暫時管制措施不等同於最終處分，不得僅因已採取措施即推定當事人違規成立。"]]]]},
{id:"c",name:"中華民國刑法",en:"Criminal Code",date:"民國115年10月1日 初稿",p:[
["第一篇 總則 ／ 第一章 法例",[
[1,"行為之處罰，以行為時之法律有明文規定者為限。"],
[2,"於中華民國境內犯罪者，適用本法。在中華民國航空器內之犯罪，亦視為在本領域內。"],
[3,"一、行為後法律有變更者，原則適用行為時之法律；但若新法對被告更有利，則適用新法。|二、沒收、非拘束人身自由之保安處分適用裁判時之法律。"],
[4,"犯罪之行為或結果，有一在中華民國境內者，為在中華民國境內犯罪。"],
[5,"現役軍人之犯罪，除適用陸海空軍刑法外，仍適用本法。"]]],
["第二章 處分類型",[
[6,"一、本法處分之類型如下：|（一）遊戲端永久停權。|（二）遊戲端暫時停權。|（三）遊戲端暫時拘留、監禁。|（四）遊戲端踢出。|（五）Discord伺服器端永久封禁。|（六）Discord伺服器端暫時封禁。|(七) 黑名單|(八) 解職/停職|二、前項處分，得單獨或併科罰之。"]]],
["第三章 刑事責任",[
[7,"行為不是故意或過失者，不罰。過失行為的處罰，以有特別規定者為準。"],
[8,"明知其行為可能發生犯罪結果，仍決意為之者，為故意。"],
[9,"行為人應注意並能注意，而疏未注意；或雖預見其結果可能發生，仍確信其不發生者，為過失。"],
[10,"有防止犯罪結果發生者，能防止而不防止，其罪責與動手者相同。"],
[11,"不得因不知法律而免除刑事責任。但情節可憫恕者，得減輕其刑。"],
[12,"行為時因精神障礙或其他缺陷，致不能辨識或控制者不罰或得減輕其刑。"],
[13,"依法令做事不罰；照命令做事者不罰，明知命令違法者不在此限。"],
[14,"依法令、職務或業務上之正當行為，不罰。"],
[15,"對現在不法侵害所為之正當防衛行為，不罰。但防衛行為顯然逾越必要程度者，得減輕或免除其刑。"],
[16,"因避免自己或他人生命、身體、自由或財產之急迫危難，而不得已所為之行為，不罰。"]]],
["第三章 未遂、教唆、幫助",[
[17,"二人以上共同實行犯罪之行為者，皆為正犯。"],
[18,"教唆他人犯罪者為教唆犯，依所教唆之罪處罰。"],
[19,"幫助他人犯罪者為幫助犯，得按正犯之刑減輕。"],
[20,"已著手於犯罪行為之實行而不遂者，為未遂犯，得按既遂犯之刑減輕之。"]]],
["第二篇 分則 ／ 第四章 刑罰分則",[
[21,"意圖破壞國體、通敵或犯叛國罪者，處遊戲端暫時停權得併科Discord伺服器暫時封禁；情節嚴重者處永久停權。"],
[22,"意圖顛覆國家政權者，處永久停權。"],
[23,"煽動群眾叛亂，著手實行且有明確事實者，得視情節輕重懲處。"],
[24,"一、故意利用遊戲漏洞，取得原本無權取得之權限、物品、利益或其他不當優勢者，處遊戲端暫時停權。|二、利用漏洞致他人遭受重大損害、破壞遊戲秩序，或經通知後仍持續利用者，得加重處分。|三、行為人發現漏洞後主動通報，且未利用該漏洞取得利益者，得減輕或免除處分。"],
[25,"使用未經允許之外掛、作弊程式、非法修改工具或其他第三方程式，取得不當遊戲優勢或破壞公平性者，處遊戲端永久停權。"],
[26,"以暴力、脅迫或其他方法妨害執法單位或政府人員執行公務者，處遊戲端暫時停權。"],
[27,"於執法單位或政府人員執行公務時，出言侮辱者，處遊戲端監禁。"],
[28,"公然冒用執法人員或政府人員服飾者，處遊戲端監禁。"],
[29,"依法逮捕、拘禁之人脫逃者，處遊戲端監禁。"],
[30,"一、公職人員故意怠忽職守、濫用權限、違反利益迴避要求、洩漏職務秘密或利用職務謀取不當利益者，依情節處停職或解職。|二、造成重大損害，或涉及故意偽造紀錄、違法處分他人者，得併科暫時停權。"],
[31,"一、意圖他人受刑事或懲戒處分，向該管公務員誣告者，處遊戲端監禁。|二、意圖他人受刑事或懲戒處分，而偽造、變造證據，或使用偽造、變造之證據者，亦同。"],
[32,"偽造、變造私文書，足以生損害於公眾或他人者，處遊戲端監禁。"],
[33,"偽造、變造公文書，足以生損害於公眾或他人者，處遊戲端監禁。"],
[34,"一、殺人者，處遊戲端監禁。|二、有預謀、反覆實施、以多數人共同圍攻，或利用職務等重大情節者，得加重處分。|三、經查明屬合法、依規則進行之戰鬥，或符合正當防衛規定者，不適用本條。"],
[35,"殺人未遂者，處遊戲端監禁。"],
[36,"傷害人之身體或健康者，處遊戲端監禁。"],
[37,"公然侮辱人者，得視情節輕重懲處。"],
[38,"意圖散布於眾而指摘或傳述足以毀損他人名譽之事者，為誹謗罪，得視情節輕重懲處。"],
[39,"洩漏軍事單位或國防以外機密者，處遊戲端監禁或暫時停權;情節重大者，得併科黑名單或解職。"],
[40,"不具相關身分或經許可進入軍事管制區域者，得由執法人員或軍職人員逕行處三百秒以上六百秒以下遊戲端監禁。"],
[41,"以強暴、脅迫使人行無義務之事或妨害人行使權利者，視情節輕重懲處。"],
[42,"於執行審判職務之公署審判時或於檢察官偵查時，證人、鑑定人、通譯於案情有重要關係之事項，供前或供後具結，而為虛偽陳述者，視情節輕重懲處。"],
[43,"不當持有或侵占業務上之物品，意圖為自己或第三人之不法所有，處遊戲端監禁。"],
[44,"駕駛車輛時，以超速、逆向行駛、危險超車、惡意蛇行、故意衝撞或其他危險方式駕駛，足以危害他人生命、身體或公共通行安全者，處遊戲端監禁。"],
[45,"一、故意以暴力、破壞設施、持續阻塞或其他不法方式，嚴重干擾依法公告之訓練、招募、典禮或其他重大活動者，處遊戲端監禁。|二、情節重大，致活動無法進行者，得併科暫時停權。"]]],
["第三篇 附則",[
[46,"一、累犯者，得加重其刑。|二、本法所稱累犯為執行完畢於十五日內再犯監禁(含)以上之罪的人。"],
[47,"嫌疑人未經判決證明有罪確定前，推定其為無罪。"],

let cur="all";const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const tabs=$("#tabs");[["all","全部"],...L.map(l=>[l.id,l.name])].forEach(([id,n])=>{const b=document.createElement("button");b.textContent=n;b.dataset.id=id;b.onclick=()=>{cur=id;render()};tabs.appendChild(b)});
function render(){const q=$("#q").value.trim(),re=q?new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g"):null;let h="",n=0;
tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.id===cur));
L.filter(l=>cur==="all"||l.id===cur).forEach(l=>{let s="",c=0;
l.p.forEach(([hd,arts])=>{let a="";arts.forEach(([no,t])=>{if(re&&!(re.test(t)||re.test("第"+no+"條"))){re.lastIndex=0;return}re.lastIndex=0;c++;
const body=t.split("|").map(x=>"<p>"+(re?esc(x).replace(re,m=>"<mark>"+m+"</mark>"):esc(x))+"</p>").join("");
a+=`<div class="art" id="${l.id}${no}"><div class="no">第 ${no} 條</div><div>${body}</div></div>`});
if(a)s+=`<h3>${hd}</h3>${a}`});
n+=c;if(s){const jump=!re?`<div class="jump">${l.p.flatMap(p=>p[1]).map(a=>`<a href="#${l.id}${a[0]}">${a[0]}</a>`).join("")}</div>`:"";
h+=`<h2>${l.name}</h2><div class="tag">${l.en} · ${l.date}${re?" · 符合 "+c+" 條":""}</div>${jump}${s}`}});
$("#out").innerHTML=(re?`<div class="meta">共找到 ${n} 條符合「${esc(q)}」的條文</div>`:"")+(h||'<div class="meta">找不到符合的條文。</div>')}
$("#q").oninput=render;render();
